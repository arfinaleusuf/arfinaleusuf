<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Code Bracket Left: < -->
  <path d="M196 160L96 256L196 352" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Code Slash: / -->
  <path d="M284 136L228 376" stroke="url(#iconGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />

  <!-- Code Bracket Right: > -->
  <path d="M316 160L416 256L316 352" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Orbiting Node Particles -->
  <circle cx="96" cy="96" r="12" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="416" cy="416" r="10" fill="#818cf8" filter="url(#glow)" />
  <circle cx="420" cy="110" r="8" fill="#34d399" />
</svg>
